[project]
name = "safari-bookmarks-mcp"
authors = [
  { name="Kingsley Chiejine", email="chikingsley@gmail.com" },
]
description = "A CLI and MCP server to manage bookmarks in the Safari web browser."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.14.2",
  "mcp>=2.3.0,<3",
]
dynamic = ["version"]

[project.optional-dependencies]
build = [
  "hatch>=1.18.2",
  "hatchling>=1.33.0",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "ruff>=0.17.3",
  "ty>=0.0.97",
]
audit = [
  "zizmor>=1.32.0",
]

[tool.uv]
default-groups = ["dev"]
# `uv audit` is the supply-chain gate, and setup-uv reads this to pick its uv version.
required-version = ">=0.13.7"

[project.urls]
"Homepage" = "https://github.com/chikingsley/safari-bookmarks-mcp"
"Bug Tracker" = "https://github.com/chikingsley/safari-bookmarks-mcp/issues"

[project.scripts]
safari-bookmarks = "safaribookmarks.cli.main:main"
safari-bookmarks-mcp = "safaribookmarks.mcp.server:main"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safaribookmarks"]

[tool.hatch.build.targets.sdist]
include = ["src/safaribookmarks", "pyproject.toml", "README.md", "LICENSE"]

[tool.hatch.version]
source = "code"
expression = "VERSION"
path = "src/safaribookmarks/version.py"
search-paths = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "CPY",                               # no copyright header boilerplate in this project
    "line-too-long",                     # handled by the formatter
    "function-call-in-default-argument", # existing CLI API patterns
    "missing-trailing-comma",            # conflicts with the Ruff formatter
    "D",                                 # no docstring requirement for this small CLI package
    "EM",                                # exception message constants add noise here
    "magic-value-comparison",            # literal comparisons are clear in this code
    "raise-vanilla-args",                # direct exception messages are clearer in this CLI
]

[tool.ruff.lint.per-file-ignores]
"src/safaribookmarks/bookmarks.py" = [
    "too-many-public-methods", # tree wrapper intentionally exposes list-like and domain operations
    "private-member-access",   # same-class tree mutations need direct child node/parent updates
]
"src/safaribookmarks/mcp/bootstrap.py" = ["too-many-locals"]
"src/safaribookmarks/mcp/server.py" = [
    "builtin-argument-shadowing", # MCP schema uses the public field name `id`
    "complex-structure",
]
"tests/test_mcp_server.py" = ["any-type"]
"tests/**" = [
    "assert",
    "hardcoded-temp-file",
    "FBT",
    "no-self-use",
    "too-many-arguments",
    "import-outside-top-level",
    "TC",
    "hashlib-insecure-hash-function",
]
"src/**/cli/commands.py" = ["FBT", "too-many-arguments"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
include = ["src", "tests"]
exclude = ["demo.py"]
respect-ignore-files = true

[tool.ty.rules]
all = "error"
# Pydantic model aliases and fixture dictionaries intentionally include many external keys
unknown-argument = "ignore"

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.environment]
python-version = "3.12"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]
pythonpath = "src"
