name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - src/safaribookmarks/version.py

permissions: {}

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        run: |
          version=$(sed -n -E '/VERSION/s/[^=]+=\s*//p' src/safaribookmarks/version.py | sed -E 's/(^[^"]*"|"[^"]*$)//g')
          tag="v${version}"
          echo "new_version=${version}" >> "$GITHUB_OUTPUT"
          echo "new_tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build package
        run: uv build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.new_tag }}
          TARGET_COMMIT: ${{ github.sha }}
        run: gh release create "$RELEASE_TAG" dist/** --draft --generate-notes --target "$TARGET_COMMIT"
